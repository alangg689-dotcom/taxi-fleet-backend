name: Tests

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    # Mismas credenciales/puertos que docker-compose.yml: así conftest.py se
    # conecta con sus defaults de siempre, sin variables de entorno extra.
    services:
      db:
        image: timescale/timescaledb-ha:pg16
        env:
          POSTGRES_USER: flotilla
          POSTGRES_PASSWORD: flotilla
          POSTGRES_DB: flotilla
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flotilla"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Correr pruebas
        # python -m pytest (no "pytest" a secas): agrega el directorio actual
        # al sys.path, que es lo que hace importable el paquete app/.
        run: python -m pytest -v
